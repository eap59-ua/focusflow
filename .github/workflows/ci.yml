name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Servicios mapeados a los MISMOS puertos que docker-compose.yml y que
    # .env.test (committeado): Postgres 55432, Redis 6379, Mailpit 1025/8025.
    # Así los tests de integración corren sin reconfigurar nada (.env.test ya
    # trae DATABASE_URL/REDIS_URL/TOKEN_ENCRYPTION_KEY dummy — no hacen falta
    # secrets para el gate).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: focusflow
          POSTGRES_PASSWORD: focusflow
          POSTGRES_DB: focusflow_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Versión leída de package.json (packageManager: pnpm@10.x).

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit

      # globalSetup de integración crea la BD focusflow_test y corre
      # `prisma migrate deploy` contra la URL de .env.test; no hace falta un
      # paso de migración aparte.
      - run: pnpm test:integration
